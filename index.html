      [data-lin-hidden-metrika-widget="true"],
      iframe[src*="mc.yandex"],
      iframe[src*="yandex.ru/watch"],
      body > div[id*="ym"],
      body > div[class*="ym"],
      body > div[id*="metrika"],
      body > div[class*="metrika"] {

        height: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
        visibility: hidden !important;

    <script type="text/javascript">
      window.__linHideMetrikaWidgets = function () {
        var nodes = Array.prototype.slice.call(document.querySelectorAll('iframe, div, a, button'));
        nodes.forEach(function (node) {
          var id = (node.id || '').toLowerCase();
          var className = String(node.className || '').toLowerCase();
          var src = (node.getAttribute('src') || node.getAttribute('href') || '').toLowerCase();
          var text = (node.textContent || '').trim();
          var rect = node.getBoundingClientRect ? node.getBoundingClientRect() : { width: 0, height: 0 };
          var isMetrikaNode = src.indexOf('mc.yandex') !== -1 || src.indexOf('yandex.ru/watch') !== -1 || id.indexOf('ym') !== -1 || className.indexOf('ym') !== -1 || className.indexOf('metrika') !== -1;
          var looksLikeBadge = rect.width > 24 && rect.width < 160 && rect.height > 24 && rect.height < 160 && (text.indexOf('</>') !== -1 || text.length < 8);
          if (isMetrikaNode && looksLikeBadge) {
            node.setAttribute('data-lin-hidden-metrika-widget', 'true');
          }
        });
      };
      window.__linHideMetrikaWidgets();
      new MutationObserver(window.__linHideMetrikaWidgets).observe(document.documentElement, { childList: true, subtree: true });
    </script>
